<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Importer un quiz — Local QCM</title>
  <link rel="icon" href="../assets/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/importer.css">
</head>
<body>

  <!-- ─── HEADER ─── -->
  <header class="header">
    <div class="header-inner">
      <a href="../index.html" class="header-logo">
        <img src="../assets/logo.png" alt="Local QCM">
        <span>Local QCM</span>
      </a>
      <nav class="header-nav">
        <a href="../index.html" class="btn btn-sm btn-back">Retour</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Basculer mode sombre">
          <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="page-main">

    <!-- ─── ENTETE DE PAGE ─── -->
    <div class="page-header">
      <h1>Importer &amp; modifier un quiz</h1>
      <p>Importez et modifiez facilement vos questionnaires</p>
    </div>

    <!-- ─── ZONE D'IMPORT : drag & drop ou clic ─── -->
    <div class="upload-zone" id="uploadZone">
      <img src="../assets/icons/upload.png" alt="">
      <p class="upload-title">Déposez votre fichier JSON ici</p>
      <p class="upload-sub">ou cliquez pour parcourir</p>
      <input type="file" id="fileInput" accept=".json" class="upload-input">
      <label for="fileInput" class="btn btn-primary btn-sm">Parcourir</label>
    </div>

    <!-- ─── EDITEUR : apparait apres import du fichier ─── -->
    <div class="editor-section" id="editorSection" style="display:none;">

      <!-- Metadonnees du quiz -->
      <div class="editor-meta">
        <div class="input-group">
          <label for="quizTitle">Titre du quiz</label>
          <input type="text" id="quizTitle" placeholder="Titre du questionnaire">
        </div>
        <div class="input-group">
          <label for="quizAuthor">Auteur</label>
          <input type="text" id="quizAuthor" placeholder="Votre nom">
        </div>
      </div>

      <!-- Liste des questions -->
      <div class="questions-header">
        <h2>Questions</h2>
      </div>

      <div class="questions-list" id="questionsList"></div>

      <div style="text-align:center; margin-top: 1rem;">
        <button class="btn btn-primary btn-sm" id="addQuestionBtn">+ Ajouter une question</button>
      </div>

      <!-- Bouton export -->
      <div class="editor-actions">
        <button class="btn btn-primary" id="exportBtn">Exporter le JSON</button>
      </div>
    </div>

  </main>

  <script src="../js/animate.js"></script>
  <script src="../js/importer.js"></script>
</body>
</html>
